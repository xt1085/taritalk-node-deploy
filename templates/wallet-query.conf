# Wallet Query over HTTPS (written by taritalk-node-deploy). The node's
# Wallet Query listens on 127.0.0.1:9000 only; Nginx forwards the six
# read-only endpoints and /json_rpc to it, for any origin (CORS *).
map $http_origin $wq_cors_origin {
    default "*";
}
map $http_origin $wq_origin_rejected {
    default 0;
}
map $http_access_control_request_headers $wq_headers_rejected {
    default 1;
    "" 0;
    ~*^content-type$ 0;
}
map $http_content_type $wq_json_type {
    default 0;
    "~*^application/json(?:\s*;.*)?$" 1;
}
log_format wallet_query '$time_iso8601 method=$request_method path=$uri status=$status duration=$request_time bytes=$body_bytes_sent';

server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 444;
}
server {
    listen 80;
    server_name @DOMAIN@;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        alias @WEBROOT@/.well-known/acme-challenge/;
        default_type text/plain;
    }
    location / { return 308 https://@DOMAIN@$request_uri; }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
}

server {
    listen 443 ssl http2;
    server_name @DOMAIN@;
    ssl_certificate @TLS_DIR@/fullchain.pem;
    ssl_certificate_key @TLS_DIR@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:WALLETQUERY:10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/wallet-query-access.log wallet_query;
    error_log /dev/null;

    client_max_body_size 0;
    client_body_timeout 60s;
    send_timeout 120s;
    keepalive_timeout 30s;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_next_upstream off;
    proxy_redirect off;
    proxy_pass_request_headers off;
    proxy_set_header Host 127.0.0.1:9000;
    proxy_set_header Connection "";
    proxy_set_header Content-Type $http_content_type;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header X-Powered-By;

    add_header Access-Control-Allow-Origin $wq_cors_origin always;
    add_header Vary Origin always;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;

    if ($host != @DOMAIN@) { return 444; }
    if ($wq_origin_rejected = 1) { return 403; }

    location ~ ^/(get_tip_info|get_header_by_height|get_height_at_time|sync_utxos_by_block|get_utxos_by_block|generate_kernel_merkle_proof)$ {
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) { return 405; }
        if ($wq_headers_rejected = 1) { return 403; }
        if ($http_access_control_request_method !~ ^(GET|HEAD)?$) { return 405; }
        add_header Access-Control-Allow-Origin $wq_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host 127.0.0.1:9000;
        proxy_set_header Connection "";
        proxy_pass http://127.0.0.1:9000$uri$is_args$args;
    }
    location = /json_rpc {
        if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
        if ($wq_headers_rejected = 1) { return 403; }
        if ($http_access_control_request_method !~ ^(POST)?$) { return 405; }
        add_header Access-Control-Allow-Origin $wq_cors_origin always;
        add_header Vary Origin always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        if ($request_method = OPTIONS) { return 204; }
        if ($wq_json_type = 0) { return 415; }
        proxy_pass http://127.0.0.1:9000/json_rpc;
    }
    location / { return 404; }
}
