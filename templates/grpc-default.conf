# Base Node gRPC (written by taritalk-node-deploy): the default servers, on
# a server without Wallet Query. Other names get no answer.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
    access_log off;
    error_log /dev/null;
}
