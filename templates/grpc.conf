# Base Node gRPC over HTTPS (written by taritalk-node-deploy). The node's
# gRPC listens on 127.0.0.1:18142 only and allows only read-only methods
# (grpc_server_allow_methods); Nginx passes on calls to the BaseNode
# service over HTTP/2. Not a website: every other path gets 404.
log_format base_node_grpc '$time_iso8601 method=$request_method path=$uri status=$status duration=$request_time bytes=$body_bytes_sent';

server {
    listen 80;
    server_name @DOMAIN@;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        alias @WEBROOT@/.well-known/acme-challenge/;
        default_type text/plain;
    }
    location / { return 404; }
}

server {
    listen 443 ssl http2;
    server_name @DOMAIN@;
    ssl_certificate @TLS_DIR@/fullchain.pem;
    ssl_certificate_key @TLS_DIR@/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:BASENODEGRPC:10m;
    ssl_session_tickets off;
    server_tokens off;
    access_log /var/log/nginx/base-node-grpc-access.log base_node_grpc;
    error_log /dev/null;

    client_max_body_size 64k;
    client_body_timeout 60s;
    send_timeout 120s;
    keepalive_timeout 30s;
    grpc_connect_timeout 5s;
    grpc_read_timeout 120s;
    grpc_send_timeout 120s;
    grpc_next_upstream off;

    if ($host != @DOMAIN@) { return 444; }

    location /tari.rpc.BaseNode/ {
        grpc_pass grpc://127.0.0.1:18142;
    }
    location / { return 404; }
}
