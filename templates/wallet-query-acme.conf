# Wallet Query, first stage (written by taritalk-node-deploy): plain HTTP
# only, for the ZeroSSL domain check. Replaced by the HTTPS configuration
# once the certificate is in place.
server {
    listen 80 default_server;
    server_name _;
    access_log off;
    error_log /dev/null;
    return 444;
}
server {
    listen 80;
    server_name @DOMAIN@;
    access_log off;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        alias @WEBROOT@/.well-known/acme-challenge/;
        default_type text/plain;
    }
    location / { return 404; }
}
